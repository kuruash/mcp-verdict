name: Package dry run

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build without publishing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
