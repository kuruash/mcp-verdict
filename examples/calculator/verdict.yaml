checks:
  - name: add
    server:
      command:
        - python
        - examples/calculator/server.py
    tool:
      name: add
      arguments:
        a: 7
        b: 5
    expected: success
  - name: divide
    server:
      command:
        - python
        - examples/calculator/server.py
    tool:
      name: divide
      arguments:
        a: 20
        b: 4
    expected: success
  - name: divide-by-zero
    server:
      command:
        - python
        - examples/calculator/server.py
    tool:
      name: divide
      arguments:
        a: 1
        b: 0
    expected: tool_error
