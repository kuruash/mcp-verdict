[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-verdict"
version = "0.1.0"
description = "Test MCP server security boundaries and failure handling"
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Ashish Kurumeti"}]
keywords = ["mcp", "testing", "security", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "mcp>=1.30,<2",
    "PyYAML>=6,<7",
]

[project.urls]
Homepage = "https://github.com/kuruash/mcp-verdict"
Repository = "https://github.com/kuruash/mcp-verdict"
Issues = "https://github.com/kuruash/mcp-verdict/issues"

[project.scripts]
mcp-verdict = "mcp_verdict.cli.main:main"

[project.optional-dependencies]
test = [
    "pytest>=8,<9",
    "ruff>=0.8,<1",
    "mypy>=1.13,<2",
    "types-PyYAML>=6,<7",
]

[tool.setuptools.packages.find]
include = ["mcp_verdict*"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["dist", "build"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B017", "E501"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
files = ["mcp_verdict"]
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
